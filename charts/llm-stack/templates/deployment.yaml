apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "llm-stack.labels" . | nindent 4 }}
    scrape-target: {{ .Values.metrics.scrapeTarget }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "llm-stack.name" . }}
      scrape-target: {{ .Values.metrics.scrapeTarget }}
  template:
    metadata:
      labels:
        {{- include "llm-stack.labels" . | nindent 8 }}
        scrape-target: {{ .Values.metrics.scrapeTarget }}
      annotations:
        # Правка ConfigMap или Secret сама по себе под не перезапускает.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: gateway
          image: {{ include "llm-stack.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: GATEWAY_CONFIG
              value: /etc/gateway/config.yaml
          volumeMounts:
            - name: config
              mountPath: /etc/gateway
              readOnly: true
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: llm-gateway-config
        - name: data
          persistentVolumeClaim:
            claimName: llm-gateway-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llm-gateway-data
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "llm-stack.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
