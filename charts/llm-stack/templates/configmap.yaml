apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-gateway-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "llm-stack.labels" . | nindent 4 }}
data:
  # Каталог моделей, лимиты и цены. Токены — в Secret, здесь только структура.
  config.yaml: |
    {{- toYaml .Values.config | nindent 4 }}
