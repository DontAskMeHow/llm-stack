{{- if .Values.monitoring.dashboard }}
# Grafana в этом контуре находит дашборды по лейблу grafana_dashboard=1.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-llm
  namespace: kube-system
  labels:
    grafana_dashboard: "1"
data:
  llm-inference.json: |-
    {{- .Files.Get "files/llm-inference-dashboard.json" | nindent 4 }}
{{- end }}
