apiVersion: v1
kind: Service
metadata:
  name: llm-inference
  namespace: llm
  labels:
    app.kubernetes.io/name: llm-stack
    scrape-target: llm-inference
spec:
  # Без selector: метрики приходят реверс-форвардом на адрес узла, а не из пода.
  # EndpointSlice для такого сервиса делает endpoint-контроллер из Endpoints.
  ports:
    - {name: inference, port: 8040, targetPort: 8040}
    - {name: node-head, port: 9101, targetPort: 9101}
    - {name: dcgm-head, port: 9401, targetPort: 9401}
    - {name: node-worker, port: 9102, targetPort: 9102}
    - {name: dcgm-worker, port: 9402, targetPort: 9402}
---
apiVersion: v1
kind: Endpoints
metadata:
  name: llm-inference
  namespace: llm
subsets:
  - addresses:
      - ip: 10.0.0.11
    ports:
      - {name: inference, port: 8040}
      - {name: node-head, port: 9101}
      - {name: dcgm-head, port: 9401}
      - {name: node-worker, port: 9102}
      - {name: dcgm-worker, port: 9402}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: llm-inference
  namespace: llm
  labels:
    app.kubernetes.io/name: llm-stack
    release: monitoring
spec:
  namespaceSelector:
    matchNames: [llm]
  selector:
    matchLabels:
      scrape-target: llm-inference
  endpoints:
    # Метрики инференса отдаёт тот же маршрут, что и API. scrapeTimeout длиннее
    # дефолтных 10 с: первый скрейп после простоя идёт через цепочку туннелей.
    - {port: inference, path: /llm/next/metrics, interval: 30s, scrapeTimeout: 25s}
    - port: node-head
      interval: 30s
      scrapeTimeout: 25s
      relabelings: [{targetLabel: member, replacement: head}]
    - port: dcgm-head
      interval: 30s
      scrapeTimeout: 25s
      relabelings: [{targetLabel: member, replacement: head}]
    - port: node-worker
      interval: 30s
      scrapeTimeout: 25s
      relabelings: [{targetLabel: member, replacement: worker}]
    - port: dcgm-worker
      interval: 30s
      scrapeTimeout: 25s
      relabelings: [{targetLabel: member, replacement: worker}]
