apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  namespace: llm
  labels:
    app.kubernetes.io/name: llm-stack
    scrape-target: llm-gateway
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-stack
      scrape-target: llm-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-stack
        scrape-target: llm-gateway
    spec:
      containers:
        - name: gateway
          image: home-ai-gateway:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8090}
          env:
            - {name: GATEWAY_CONFIG, value: /etc/gateway/config.yaml}
          volumeMounts:
            - {name: config, mountPath: /etc/gateway, readOnly: true}
            - {name: data, mountPath: /data}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
      volumes:
        - name: config
          configMap: {name: llm-gateway-config}
        - name: data
          persistentVolumeClaim: {claimName: llm-gateway-data}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llm-gateway-data
  namespace: llm
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
