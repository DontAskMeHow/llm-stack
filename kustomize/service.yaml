metadata:
  name: llm-gateway
  namespace: llm
  labels:
    app.kubernetes.io/name: llm-stack
    scrape-target: llm-gateway
spec:
  selector:
    app.kubernetes.io/name: llm-stack
    scrape-target: llm-gateway
  ports:
    - {name: http, port: 8090, targetPort: http}
